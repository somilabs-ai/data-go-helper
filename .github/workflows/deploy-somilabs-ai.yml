# [somilabs-ai 전용] Staging/Develop 배포 워크플로우
# 저장소: somilabs-ai/data-go-helper
# 대상: somilabs.ai Vercel 프로젝트 (팀 somilab)
#
# B(somilabs-ai) Vercel 계정은 GitHub Login Connection 이 없어 저장소 연동 자동배포를
# 쓸 수 없다(somilabs-hub#60). 그래서 --token 으로 배포한다 — ADR-0021 D8-1.
#
# 필요한 시크릿 3건 (repo Settings > Secrets and variables > Actions):
#   SOMILAB_AI_VERCEL_TOKEN       pass vercel/somilabs-ai/token 의 1행
#   SOMILAB_AI_VERCEL_ORG_ID      같은 항목의 team_id
#   SOMILAB_AI_VERCEL_PROJECT_ID  Vercel 프로젝트 id
# 시크릿이 없으면 빈 문자열로 떨어져 `--token=` 만 남고
# "You defined --token, but it's missing a value" 로 죽는다.
#
# 참고: DATA_GO_KR_TEST_KEY 는 Vercel 에 넣지 않았다. 코드에 폴백이 있어
# (`process.env.DATA_GO_KR_TEST_KEY || 'data-portal-test-key'`) 배포는 되며,
# pass 의 data-go-kr 키는 다른 API(온비드)용인 데다 공개 노출 이력으로
# 재발급 대기 상태다. somilabs-dev/somilabs-hub#178 참조.

name: Deploy to somilabs.ai (Staging)

on:
  push:
    branches:
      - develop

jobs:
  deploy-somilabs-ai:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.SOMILAB_AI_VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.SOMILAB_AI_VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.SOMILAB_AI_VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Verify required secrets
        run: |
          missing=0
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!v}" ]; then echo "::error::secret $v 가 비어 있다"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build Project Artifacts
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --token="$VERCEL_TOKEN"
